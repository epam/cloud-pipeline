plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.3.13'
    id 'io.spring.dependency-management' version '1.1.7'
}

repositories {
    gradlePluginPortal()
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}


dependencies {
    configurations {
        all*.exclude module: 'spring-boot-starter-logging'
        all*.exclude group: 'commons-logging', module: 'commons-logging'
        all*.exclude group: 'com.fasterxml.jackson.module', module: 'jackson-module-jaxb-annotations'
    }

    implementation project(':cloud-pipeline-common:model')

    implementation 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    //Spring
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-tomcat'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    // DB
    implementation 'com.h2database:h2:2.3.232'
    implementation 'com.mchange:c3p0:0.9.5.2'

    // Mapstruct
    implementation group: "org.mapstruct", name: "mapstruct", version: mapstructVersion
    annotationProcessor group: "org.mapstruct", name: "mapstruct-processor", version: mapstructVersion

    implementation 'com.auth0:java-jwt:3.3.0'

    implementation 'commons-validator:commons-validator:1.5.0'
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'org.apache.commons:commons-text:1.4'
    implementation 'org.apache.commons:commons-lang3:3.8'
    implementation 'org.apache.commons:commons-collections4:4.0'
    implementation 'commons-io:commons-io:2.6'

    implementation 'com.google.cloud:google-cloud-storage:1.34.0'

    implementation 'org.thymeleaf:thymeleaf:3.0.9.RELEASE'

    implementation "com.squareup.retrofit2:retrofit:$retrofitVersion"
    implementation "com.squareup.retrofit2:converter-jackson:$retrofitVersion"

    // XML parsing
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.0'
    implementation 'jakarta.validation:jakarta.validation-api:3.1.1'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.16.0'
    implementation 'com.fasterxml.woodstox:woodstox-core:5.1.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.github.marschall:memoryfilesystem:1.2.1'
    testImplementation 'org.projectlombok:lombok:1.18.34'
    testImplementation "org.hamcrest:hamcrest-all:$hamcrestVersion"

    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'
}

bootJar {
    archiveFileName = "data-transfer-service.jar"
    manifest {
        attributes(
                "Implementation-Version": "$version")
    }
}

jar {
    enabled = false
}

test {
    useJUnitPlatform()
    reports.html.required = true
}

jacocoTestReport {
    reports {
        xml.required = false
        csv.required = false
        html.required = true
    }
}
