name: PMD & CheckStyle
on:
  pull_request:
    branches: [ develop ]
    paths:
      - 'api/**'
      - 'billing-report-agent/**'
      - 'cloud-pipeline-common/**'
      - 'core/**'
      - 'data-transfer-service/**'
      - 'data-sharing-service/**'
      - 'docker-comp-scan/**'
      - 'elasticsearch-agent/**'
      - 'elasticsearch-common/**'
      - 'monitoring-service/**'
      - 'notifier/**'
      - 'vm-monitor/**'

jobs:
  pmd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "8"
          cache: "gradle"

      - name: pmd
        run: ./gradlew pmdMain pmdTest
      - uses: jwgmeligmeyling/pmd-github-action@v1.2
        with:
            name: 'PMD Report'
            path: '**/pmd/*.xml'
        if: always()

  checkstyle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "8"
          cache: "gradle"

      - name: checkstyle
        run: ./gradlew checkstyleMain checkstyleTest
      - uses: jwgmeligmeyling/checkstyle-github-action@v1.2
        with:
            name: 'Checkstyle Report'
            path: '**/checkstyle/*.xml'
        if: always()
