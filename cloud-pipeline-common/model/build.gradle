plugins {
    id 'java'
    id 'maven-publish'
    id 'jacoco'
    id 'io.spring.dependency-management' version '1.1.7'
}

group 'com.epam.pipeline'

ext {
    springBootVersion = '3.3.13'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    }
}

dependencies {
    implementation 'org.springframework.security:spring-security-acl'
    implementation 'jakarta.persistence:jakarta.persistence-api'

    // Jackson (versions from Boot BOM)
    implementation 'com.fasterxml.jackson.core:jackson-annotations'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // OpenAPI annotations only (@Schema) — not the full springdoc UI starter
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.22'

    // Apache commons (only commons-lang3 is managed by the Boot BOM)
    implementation 'commons-io:commons-io:2.16.1'
    implementation 'org.apache.commons:commons-lang3'
    implementation 'commons-collections:commons-collections:3.2.2'
    implementation 'org.apache.commons:commons-collections4:4.4'
    implementation 'org.apache.commons:commons-text:1.12.0'

    // Logging API used by @Slf4j / LoggerFactory (implementation provided by consumers)
    implementation 'org.slf4j:slf4j-api'

    // Kubernetes model + Retrofit clients
    implementation 'io.fabric8:kubernetes-model:3.0.3'
    implementation 'com.squareup.retrofit2:retrofit:2.3.0'
    implementation 'com.squareup.retrofit2:converter-jackson:2.3.0'
    implementation 'com.squareup.okhttp3:okhttp:3.9.1'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.hamcrest:hamcrest'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}

test {
    useJUnitPlatform()
    reports.html.required = true
}
