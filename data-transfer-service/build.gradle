plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '2.7.18'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'de.undercouch.download' version '3.1.2'
}

repositories {
    gradlePluginPortal()
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

import de.undercouch.gradle.tasks.download.Download

dependencies {
    configurations {
        all*.exclude module: 'spring-boot-starter-logging'
    }

    implementation project(':cloud-pipeline-common:model')
    implementation 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    implementation "org.apache.logging.log4j:log4j-slf4j-impl:$log4jVersion"
    implementation "org.apache.logging.log4j:log4j-api:$log4jVersion"
    implementation "org.apache.logging.log4j:log4j-core:$log4jVersion"
    implementation "org.apache.logging.log4j:log4j-jcl:$log4jVersion"

    implementation "org.springframework.boot:spring-boot-starter:$springBootVersion"
    implementation "org.springframework.boot:spring-boot-starter-web:$springBootVersion"
    implementation "org.springframework.boot:spring-boot-starter-tomcat:$springBootVersion"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa:$springBootVersion"
    implementation "org.springframework.boot:spring-boot-starter-security:$springBootVersion"

    //OpenApi
    implementation 'org.springdoc:springdoc-openapi-ui:1.8.0'

    implementation 'com.h2database:h2:1.4.197'
    implementation 'com.mchange:c3p0:0.9.5.2'

    implementation "org.mapstruct:mapstruct-jdk8:$mapstructVersion"
    implementation "org.mapstruct:mapstruct-processor:$mapstructVersion"

    implementation 'com.auth0:java-jwt:3.3.0'

    implementation 'commons-validator:commons-validator:1.5.0'
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'org.apache.commons:commons-text:1.4'
    implementation 'org.apache.commons:commons-lang3:3.8'
    implementation 'org.apache.commons:commons-collections4:4.0'
    implementation 'commons-io:commons-io:2.6'

    implementation 'com.google.cloud:google-cloud-storage:1.34.0'

    implementation 'org.thymeleaf:thymeleaf:3.0.9.RELEASE'

    implementation "com.squareup.retrofit2:retrofit:$retrofitVersion"
    implementation "com.squareup.retrofit2:converter-jackson:$retrofitVersion"

    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.9.6'
    annotationProcessor 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.9.6'
    implementation 'com.fasterxml.woodstox:woodstox-core:5.1.0'
    annotationProcessor 'com.fasterxml.woodstox:woodstox-core:5.1.0'
    implementation 'jakarta.xml.bind:jaxb-api:2.3.1'
    annotationProcessor 'jakarta.xml.bind:jaxb-api:2.3.1'
    implementation 'jakarta.validation:validation-api:2.0.1.Final'

    testImplementation "org.springframework.boot:spring-boot-starter-test:$springBootVersion"
    testImplementation 'com.github.marschall:memoryfilesystem:1.2.1'
    testImplementation 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'
    testImplementation "org.hamcrest:hamcrest-all:$hamcrestVersion"
    testImplementation "org.mockito:mockito-core:$mockitoVersion"
    testImplementation "org.mockito:mockito-junit-jupiter:$mockitoVersion"
}

bootJar {
    archiveFileName = "data-transfer-service.jar"
    manifest {
        attributes(
                "Implementation-Version": "$version")
    }
}

test {
    useJUnitPlatform()
    reports.html.required = true
}

jacocoTestReport {
    reports {
        xml.required = false
        csv.required = false
        html.required = true
    }
}

def jreURL = "https://cloud-pipeline-oss-builds.s3.amazonaws.com/tools/java/"
def windowsJre = "OpenJDK8U-jre_x64_windows_hotspot_8u292b10.zip"
def windowsJrePath = "jdk8u292-b10-jre"
def linuxJre = "openjdk-1.8.0_222_linux-x64_bin.tar.gz"
def linuxJrePath = "openjdk-8u222-b10"

task customStartScriptsWin(type: CreateStartScripts) {
    applicationName = 'dts'
    mainClassName = 'org.springframework.boot.loader.JarLauncher'
    classpath = files('data-transfer-service.jar')
    defaultJvmOpts = ["-Xms512m", "-Xmx2g"]
    outputDir = file("$buildDir/scripts")
    doLast {
        windowsScript.text = windowsScript.text.replace("set JAVA_EXE=%JAVA_HOME%/bin/java.exe",
                "set JAVA_EXE=%APP_HOME%/jre/bin/java.exe")
    }
}

task downloadJreWin(type: Download) {
    dependsOn bootJar
    src jreURL + windowsJre
    dest "$buildDir/downloads/$windowsJre"
    overwrite true
}

task unpackJreWin(type: Copy) {
    dependsOn downloadJreWin
    from(zipTree("$buildDir/downloads/$windowsJre"))
    into("$buildDir/downloads")
}

task bundleWindows(type: Zip) {
    dependsOn unpackJreWin, customStartScriptsWin, bootJar
    from ("$buildDir/downloads/$windowsJrePath") {
        include '**/*'
        into('jre')
    }
    from("$buildDir/libs") {
        include '**/*.jar'
        into('lib')
    }
    from("$buildDir/scripts") {
        into('bin')
    }
    archiveBaseName = 'dts'
    archiveFileName = 'data-transfer-service-windows.zip'
}

task customStartScriptsLinux(type: CreateStartScripts) {
    applicationName = 'dts'
    mainClassName = 'org.springframework.boot.loader.JarLauncher'
    classpath = files('data-transfer-service.jar')
    defaultJvmOpts = ["-Xms512m", "-Xmx2g"]
    outputDir = file("$buildDir/scripts")
    doLast {
        unixScript.text = unixScript.text.replace("# Determine the Java command to use to start the JVM.",
                "export JAVA_HOME=\$APP_HOME/jre/")
    }
}

task downloadJreLinux(type: Download) {
    dependsOn bootJar
    src jreURL + linuxJre
    dest "$buildDir/downloads/$linuxJre"
    overwrite true
}

task unpackJreLinux(type: Copy) {
    dependsOn downloadJreLinux
    from(tarTree(resources.gzip("$buildDir/downloads/$linuxJre")))
    into("$buildDir/downloads")
}

task bundleLinux(type: Zip) {
    dependsOn unpackJreLinux, customStartScriptsLinux, bootJar
    from ("$buildDir/downloads/$linuxJrePath") {
        include '**/*'
        into('jre')
    }
    from("$buildDir/libs") {
        include '**/*.jar'
        into('lib')
    }
    from("$buildDir/scripts") {
        into('bin')
    }
    archiveBaseName = 'dts'
    archiveFileName = 'data-transfer-service-linux.zip'
}