name: API Tests

on:
  pull_request:
    branches: [ develop, 'release/**', 'stage/**' ]

jobs:
  api-tests:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_DB: pipeline_test
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v3

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "8"
          cache: "gradle"

      - name: Verify PostgreSQL connection
        run: psql -h 127.0.0.1 -U pipeline -d pipeline_test -c "SELECT 1"
        env:
          PGPASSWORD: pipeline

      - name: Run API tests
        env:
          CP_API_TEST_DB_USER: pipeline
          CP_API_TEST_DB_PASSWORD: pipeline
        run: ./gradlew :api:test --no-build-cache

      - name: Upload test results on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: api/build/test-results/test/
          retention-days: 7
