# What the collector reads: the core v1 lists, and the kubelets' /stats/summary (nodes/stats) and
# /metrics/cadvisor (nodes/metrics). Nothing it writes goes through the Kubernetes API.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cp-metrics-collector
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cp-metrics-collector
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "namespaces"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["nodes/stats", "nodes/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cp-metrics-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cp-metrics-collector
subjects:
  - kind: ServiceAccount
    name: cp-metrics-collector
    namespace: default
