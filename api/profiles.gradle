import org.apache.tools.ant.filters.ReplaceTokens

def escape(String s) {
    return s.replace("\\", "\\\\")
}

// copies properties file and filers resources based on environment
tasks.register('copyConfiguration') {
    description = 'Copies profile-specific and test configuration files with token replacement'
    group = 'build'

    doLast {
        // Define filterTokens map
        ext.filterTokens = [:]

        // Get profile from project property, default to 'dev'
        def profile = project.hasProperty('profile') ? project.profile : 'dev'
        println "Target profile: $profile"

        // Set rootDirPath token (replace backslashes for cross-platform compatibility)
        filterTokens['rootDirPath'] = rootDir.absolutePath.replace('\\', '/')

        // Copy profile-specific resources
        copy {
            from "profiles/$profile"
            into "$buildDir/resources/main"
            include "**/*"
            filter(ReplaceTokens, tokens: filterTokens)
        }

        // Copy test resources
        copy {
            from "profiles/test"
            into "$buildDir/resources/test"
            include "**/*"
            filter(ReplaceTokens, tokens: filterTokens)
        }
    }
}