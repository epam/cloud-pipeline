# Tool settings for a project that still uses setup.py.

[flake8]
# 110, close to the 120 the Java side of this repository wraps at.
max-line-length = 110
exclude = .git,__pycache__,build,dist,*.egg-info,.venv
# W503 and W504 contradict each other, so one of them has to be off.
ignore = W503

[tool:pytest]
testpaths = tests
# `-q`: a line per file plus the failures.
addopts = -q
