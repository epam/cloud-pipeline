---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cp-main-service
  namespace: default
  annotations:
    iam.gke.io/gcp-service-account: ${CP_GSA_EMAIL}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cp-main-service-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: cp-main-service
    namespace: default
