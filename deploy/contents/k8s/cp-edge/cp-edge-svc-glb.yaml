apiVersion: v1
kind: Service
metadata:
  name: cp-edge
  namespace: default
  annotations:
    cloud.google.com/l4-rbs: "enabled"
    networking.gke.io/load-balancer-ip-addresses: ${CP_GKE_NLB_EXTERNAL_IP}
  labels:
    cloud-pipeline/cp-edge: "true"
    cloud-pipeline/role: "EDGE"
    cloud-pipeline/region: ${CP_CLOUD_REGION_ID}
spec:
  type: LoadBalancer
  selector:
    cloud-pipeline/cp-edge: "true"
    cloud-pipeline/region: ${CP_CLOUD_REGION_ID}
  ports:
    - name: cp-edge-port-https
      port: ${CP_EDGE_EXTERNAL_PORT}
      targetPort: 8080
      protocol: TCP
    - name: cp-edge-port-web
      port: ${CP_EDGE_WEB_EXTERNAL_PORT}
      targetPort: 8181
      protocol: TCP
    - name: cp-edge-port-connect
      port: ${CP_EDGE_CONNECT_EXTERNAL_PORT}
      targetPort: 8282
      protocol: TCP

