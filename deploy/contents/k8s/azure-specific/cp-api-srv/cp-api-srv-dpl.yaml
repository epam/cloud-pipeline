apiVersion: apps/v1
kind: Deployment
metadata:
  name: cp-api-srv
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      cloud-pipeline/core-component: "Deployment"
      cloud-pipeline/cp-api-srv: "true"
  template:
    metadata:
      namespace: default
      labels:
        cloud-pipeline/cp-api-srv: "true"
        cloud-pipeline/core-component: "Deployment"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  cloud-pipeline/cp-api-srv: "true"
              topologyKey: kubernetes.io/hostname
      nodeSelector:
        cloud-pipeline/cp-api-srv: "true"
      tolerations:
        - key: node-role.kubernetes.io/master
          effect: NoSchedule
      terminationGracePeriodSeconds: 50
      containers:
        - name: cp-api-srv-leader-elector
          image: ${CP_DOCKER_DIST_SRV}lifescience/cloud-pipeline:leader-elector-$CP_VERSION
          imagePullPolicy: "Always"
          securityContext:
            privileged: true
          command: [ "/elector/init" ]
          ports:
            - containerPort: 4040
          env:
            - name: HA_ELECTION_SERVICE_NAME
              value: "cp-api-srv"
            - name: HA_ELECTION_PERIOD_SEC
              value: "5"
            - name: HA_VOTE_EXPIRATION_PERIOD_SEC
              value: "7"
          envFrom:
            - configMapRef:
                name: cp-config-global
        - name: cp-api-srv
          image: ${CP_DOCKER_DIST_SRV}lifescience/cloud-pipeline:api-srv-$CP_VERSION
          imagePullPolicy: "Always"
          securityContext:
            privileged: true
          command: ["/init-api"]
          ports:
            - containerPort: 8080
          env:
            - name: CP_KUBE_EXTERNAL_HOST
              value: ""
            - name: CP_KUBE_EXTERNAL_PORT
              value: "6443"
            - name: CP_API_SRV_INTERNAL_HOST
              value: cp-api-srv.default.svc.cluster.local
            - name: CP_API_SRV_INTERNAL_PORT
              value: "31080"
            - name: CP_KUBE_MASTER_CHECK_URL
              value: http://127.0.0.1:4040/
            - name: CP_HA_DEPLOY_ENABLED
              value: "true"
            - name: CP_API_CURRENT_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CP_API_CURRENT_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          envFrom:
          - configMapRef:
              name: cp-config-global
          volumeMounts:
            - mountPath: /opt/api/pki
              name: azurefile
            - mountPath: /opt/api/sso
              name: azurefile
            - mountPath: /var/log/cp-api
              name: azurefile
            - mountPath: /opt/api/ext/templates/pipe-templates
              name: api-pipe-templates
            - mountPath: /opt/api/ext/templates/folder-templates
              name: api-folder-templates
            - mountPath: /opt/api/ext/templates/error-templates
              name: api-error-templates
            - mountPath: /opt/api/ext/templates/static
              name: api-static-assets
            - mountPath: /opt/api/etc
              name: api-etc-assets
            - mountPath: /opt/idp/pki
              name: idp-pki
            - mountPath: /opt/common/pki
              name: common-pki
              readOnly: true
            - mountPath: /opt/gitlab/pki
              name: git-pki
              readOnly: true
            - mountPath: /root/.kube
              name: kube-config
              readOnly: true
            - name: cp-cloud-credentials
              mountPath: "/root/.cloud"
              readOnly: true
              # Using /etc/cp_ssh instead of a "general" ~/.ssh/ because it may break some of the openssh-created files (e.g. known hosts)
              # as this volumes is mounted "read only"
            - name: cp-cluster-ssh-key
              mountPath: "/etc/cp_ssh"
              readOnly: true
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /liveness-api-srv.sh
            initialDelaySeconds: 180
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /liveness-api-srv.sh
            # 5 min delay to make sure API is up and running and drop pod after 60 seconds (4*15s) if API didn't respond
            initialDelaySeconds: 180
            periodSeconds: 15
            failureThreshold: 4
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      volumes:
        - name: azurefile
          persistentVolumeClaim:
            claimName: azurefile
        - name: api-pipe-templates
          hostPath:
            path: /opt/api/templates/pipe-templates
        - name: api-folder-templates
          hostPath:
            path: /opt/api/templates/folder-templates
        - name: api-error-templates
          hostPath:
            path: /opt/api/templates/error-templates
        - name: api-static-assets
          hostPath:
            path: /opt/api/templates/static
        - name: api-etc-assets
          hostPath:
            path: /opt/api/etc
        - name: idp-pki
          hostPath:
            path: /opt/idp/pki
        - name: common-pki
          hostPath:
            path: /opt/common/pki
        - name: git-pki
          hostPath:
            path: /opt/gitlab/pki
        - name: kube-config
          hostPath:
            path: /root/.kube
        - name: cp-cloud-credentials
          secret:
            secretName: cp-cloud-credentials
        - name: cp-cluster-ssh-key
          secret:
            secretName: cp-cluster-ssh-key
            # Kube accepts mode in decimal. So 384 gives 600, which is required for SSH keys
            defaultMode: 384

