name: Cloud-Pipeline-Distribution

concurrency: Cloud-Pipeline-Distribution

# We build only develop, until the GHA is proved working correctly
on:
  push:
    branches:
      - develop
      - 'release/**'
      - 'stage/**'

  workflow_dispatch:

env:
  CLOUD_PIPELINE_BUILD_NUMBER_SEED: 20000

jobs:
  Build_All:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-java@v2
        with:
          distribution: 'zulu'
          java-version: '8'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      - uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - run: sudo -E bash deploy/github_actions/gha_pack_dist.sh
        env:
          CP_DOCKER_DIST_SRV: ${{ secrets.CP_DOCKER_DIST_SRV }}