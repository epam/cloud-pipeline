buildscript {
    repositories { mavenCentral() }
}


plugins {
    id "com.github.johnrengelman.shadow" version "4.0.4"
}

apply plugin: 'java-library'

repositories { mavenCentral() }

version = '1.0.0'
archivesBaseName = 'shaded-opensearch'

dependencies {
    implementation 'org.opensearch.client:opensearch-java:1.0.0'
    implementation 'org.opensearch.client:opensearch-rest-high-level-client:1.0.0'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.2.1'
}

// We use shadow jar to have our own a copy of the original org.opensearch.action.DocWriteResponse
// Such change allows to communicate with Opensearch server of version 2.x, 3.x
// We need to do such hack because of inability to use OpenSearch SDK 3.x with Java 8 (requires Java 17)
// TODO: Once elasticsearch-agent will be using Java 17, we can get rid of this hack
shadowJar {
    // Do not allow to have more that 1 version of the same class
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    relocate('org.apache.lucene', 'shaded.org.apache.lucene8')
}

