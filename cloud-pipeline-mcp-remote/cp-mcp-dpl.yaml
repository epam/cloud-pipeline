apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name: cp-mcp
  namespace: default
spec:
  replicas: 1
  template:
    metadata:
      namespace: default
      labels:
        cloud-pipeline/cp-mcp: "true"
        cloud-pipeline/core-component: "Deployment"
    spec:
      nodeSelector:
        cloud-pipeline/cp-mcp: "true"
      tolerations:
        - key: node-role.kubernetes.io/master
          effect: NoSchedule
      containers:
        - name: cp-mcp
          image: lifescience/cloud-pipeline:mcp-0.16
          imagePullPolicy: "IfNotPresent"
          envFrom:
            - configMapRef:
                name: cp-config-global
