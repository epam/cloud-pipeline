setup.template.name: "security_log_template"
setup.template.pattern: "security_log*"
setup.template.enabled: false
setup.ilm.enabled: false
output.elasticsearch:
  hosts: ["${CP_SEARCH_ELK_INTERNAL_SCHEME}://${CP_SEARCH_ELK_INTERNAL_HOST}:${CP_SEARCH_ELK_ELASTIC_INTERNAL_PORT}"]
  pipeline: "audit_dav"
  index: "security_log"
filebeat:
  inputs:
    - paths:
        - /etc/nginx/logs/webdav.access.log
      fields:
        service: edge
        type: audit
        level: INFO
      include_lines: ['PUT', 'GET', 'MOVE', 'DELETE']
processors:
  - drop_fields:
      fields: ["log", "offset", "beat", "agent", "log.offset", "esc" ]

# The seccomp policy of filebeat 7.10 does not allow clone3, which glibc 2.34+ (Rocky Linux 9) uses to start threads
seccomp.enabled: false
