# Settings for the tools that have no command line in the checks. `setup.cfg` is the conventional
# place for them in a project that still uses setup.py.

[flake8]
# 110 rather than the default 79. The Java side of this repository wraps at 120 and the checkstyle
# ruleset says so; 110 keeps the Python close to that without letting a line run off a split screen.
max-line-length = 110
exclude = .git,__pycache__,build,dist,*.egg-info,.venv
# W503 and W504 contradict each other - one wants a line break before a binary operator, the other
# after - so one of them has to be off whichever style is used.
ignore = W503

[tool:pytest]
testpaths = tests
# `-q` keeps the output to a line per file plus the failures. The full list of test names is rarely
# what anybody wants to read.
addopts = -q
