buildscript {
    repositories { mavenCentral() }
}


plugins {
    id "com.github.johnrengelman.shadow" version "4.0.4"
}

apply plugin: 'java-library'
apply plugin: 'maven'
apply plugin: 'maven-publish'

sourceCompatibility = 1.8

repositories { mavenCentral() }


dependencies {
    implementation 'org.opensearch.client:opensearch-java:1.0.0'
    implementation 'org.opensearch.client:opensearch-rest-high-level-client:1.0.0'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.2.1'
}

shadowJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    relocate('org.opensearch.action', 'shaded.org.opensearch.action')
    relocate('org.opensearch', 'shaded.org.opensearch')
    relocate('org.apache.lucene', 'shaded.org.apache.lucene8')
}
