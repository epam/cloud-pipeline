worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    include /etc/nginx/sites-enabled/*.conf;
	include /etc/nginx/conf.d/*.conf;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    server {
        listen 8080 default_server;
        server_name  _;

        location = / {
            root ${NGS_PORTAL_ROOT};
            add_header Last-Modified $date_gmt;
            add_header Cache-Control 'no-store, no-cache';
            if_modified_since off;
            expires off;
            etag off;
            try_files /index.html =404;
        }
        location = /settings.json {
            root ${NGS_PORTAL_ROOT};
            add_header Last-Modified $date_gmt;
            add_header Cache-Control 'no-store, no-cache';
            if_modified_since off;
            expires off;
            etag off;
            try_files /settings.json =404;
        }
        location / {
            root ${NGS_PORTAL_ROOT};
            try_files $uri @index;
        }
        location @index {
            root ${NGS_PORTAL_ROOT};
            try_files /index.html =404;
        }

        location ~* /api/(.*)$ {
            resolver         10.96.0.10 valid=10s ipv6=off;
            set              $cp_api_backend "https://${CP_API_HOST}";
            proxy_pass       $cp_api_backend/pipeline/restapi/$1$is_args$args;
            proxy_set_header Host $http_host;

            proxy_connect_timeout   180s;
            proxy_send_timeout      180s;
            proxy_read_timeout      180s;

            proxy_set_header Authorization "Bearer $http_x_auth_bearer";
        }
    }
}
