apiVersion: apps/v1
kind: Deployment
metadata:
  name: cp-edge
  namespace: cloud-pipeline-test
spec:
  selector:
    matchLabels:
      cloud-pipeline/cp-edge: "true"
      cloud-pipeline/role: "EDGE"
      cloud-pipeline/region: <cloud-region-id>
  replicas: 1
  template:
    metadata:
      namespace: cloud-pipeline-test
      labels:
        cloud-pipeline/cp-edge: "true"
        cloud-pipeline/role: "EDGE"
        cloud-pipeline/region: <cloud-region-id>
        cloud-pipeline/core-component: "Deployment"
    spec:
      nodeSelector:
        cloud-pipeline/cp-edge: "true"
        cloud-pipeline/region: <cloud-region-id>
      tolerations:
      - key: node-role.kubernetes.io/master
        effect: NoSchedule
      containers:
        - name: cp-edge
          image: quay.io/lifescience/cloud-pipeline:edge-0.17
          imagePullPolicy: "Always"
          command: ["/init"]
          env:
          - name: NODE_OPTIONS
            value: "--max_old_space_size=4096"
          - name: CP_EDGE_REGION
            value: <cloud-region-id>
          envFrom:
          - configMapRef:
              name: cp-config-global
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /liveness.sh
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 4
          volumeMounts:
            - mountPath: /var/log
              subPath: edge/logs/<cloud-region-id>
              name: cp-system-pv
            - mountPath: /opt/api/pki
              subPath: api/pki
              name: cp-system-pv
              readOnly: true
            - mountPath: /opt/gitlab/pki
              subPath: gitlab/pki
              name: cp-system-pv
              readOnly: true
            - mountPath: /opt/docker-registry/pki
              subPath: docker-registry/pki
              name: cp-system-pv
              readOnly: true
            - mountPath: /opt/idp/pki
              subPath: idp/pki
              name: cp-system-pv
              readOnly: true
            - mountPath: /opt/edge/pki
              subPath: edge/pki
              name: cp-system-pv
              readOnly: true
            - mountPath: /opt/common/pki
              subPath: common/pki
              name: cp-system-pv
              readOnly: true
            - mountPath: /etc/nginx/ext/external-apps
              subPath: edge/external-apps
              name: cp-system-pv
              readOnly: true
            - mountPath: /opt/share-srv/pki
              subPath: share-srv/pki
              name: cp-system-pv
              readOnly: true
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      volumes:
        - name: cp-system-pv
          persistentVolumeClaim:
            claimName: cp-system-pvc
