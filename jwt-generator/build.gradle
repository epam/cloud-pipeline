plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'org.sonarqube' version '2.6.1'
}

group "com.epam.pipeline"
version ""

repositories  {
    mavenCentral()
}

dependencies {

    //CLI parsing
    implementation group: 'com.beust', name: 'jcommander', version: '1.64'

    implementation 'com.auth0:java-jwt:3.1.0'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-annotations', version: '2.8.7'

    //Logging
    implementation group: "org.slf4j", name: "slf4j-api", version: "1.7.21"
    implementation group: 'org.apache.logging.log4j', name: 'log4j-slf4j-impl', version: log4jVersion
    implementation group: 'org.apache.logging.log4j', name: 'log4j-api', version: log4jVersion
    implementation group: 'org.apache.logging.log4j', name: 'log4j-core', version: log4jVersion

    //commons
    implementation group: 'commons-io', name: 'commons-io', version: '2.5'
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.5'
    implementation group: 'commons-collections', name: 'commons-collections', version: '3.2.2'

    //tests
    testImplementation 'junit:junit:4.12'
}

shadowJar {
    archiveFileName = "jwt-generator.${archiveExtension.get()}"
    manifest {
        attributes 'Main-Class': 'com.epam.pipeline.jwt.generator.app.Application'
    }
}
