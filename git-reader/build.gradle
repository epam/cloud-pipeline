task build(type: Exec) {
    group = 'build'
    doFirst {
        setGRVersion()
        delete(fileTree("$project.rootDir/git-reader/dist").matching { include "gitreader-*.tar.gz" })
    }
    commandLine 'python', "$project.rootDir/git-reader/setup.py", 'sdist'
    doLast {
        cleanGRVersion()
        delete("$project.rootDir/api/src/main/resources/static/gitreader.tar.gz")
        // setup.py names the sdist after the PEP 440 form of the version, see _package_version()
        copy {
            from(fileTree("$project.rootDir/git-reader/dist").matching { include "gitreader-*.tar.gz" })
            into "$project.rootDir/api/src/main/resources/static/"
            rename { String fileName -> "gitreader.tar.gz" }
        }
        copy {
            from(fileTree("$project.rootDir/git-reader/dist").matching { include "gitreader-*.tar.gz" })
            into "$project.rootDir/git-reader/dist/"
            rename { String fileName -> "gitreader.tar.gz" }
        }
    }
}

def setGRVersion() {
    copy {
        from('gitreader/version.py')
        into('temp')
    }
    def proj = file('gitreader/version.py')
    def text = proj.getText("UTF-8")
    text = text.replaceAll(/(__version__='.+')/, "__version__=\'$version\'")
    proj.write(text, "UTF-8")
}

def cleanGRVersion() {
    copy {
        from('temp/version.py')
        into('gitreader')
    }
    delete("temp")
}
