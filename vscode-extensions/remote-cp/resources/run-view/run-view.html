<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="{{csp}}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remote Cloud Pipeline</title>
    <link rel="stylesheet" href="{{codiconCssUri}}" />
    <style nonce="{{nonce}}">
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        box-sizing: border-box;
        font-family: var(--vscode-font-family);
        font-size: var(--vscode-font-size);
        background: var(--vscode-sideBar-background);
        color: var(--vscode-sideBar-foreground);
        padding: 0px !important;
      }
      * {
        box-sizing: border-box;
      }
      .view-root {
        display: flex;
        flex-direction: column;
        gap: 8px;
        height: 100%;
        padding: 0px;
      }
      .input-box {
        width: 100%;
        padding: 4px 8px 0px 8px;
      }
      .filter-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }
      .filter-input {
        width: 100%;
        padding: 6px 8px;
        background: var(--vscode-input-background);
        color: var(--vscode-input-foreground);
        border-radius: 4px;
        border: 1px solid
          var(--vscode-input-border, var(--vscode-widget-border));
        padding-right: 28px;
      }
      .filter-input::placeholder {
        color: var(--vscode-input-placeholderForeground);
      }
      .filter-input:focus {
        outline: 1px solid var(--vscode-focusBorder);
        outline-offset: 0;
      }
      .filter-clear {
        position: absolute;
        right: 6px;
        background: transparent;
        border: 0;
        color: var(--vscode-icon-foreground);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        border-radius: 3px;
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transition: opacity 120ms ease, background-color 120ms ease;
      }
      .filter-wrapper.has-value .filter-clear {
        opacity: 0.7;
        pointer-events: auto;
      }
      .filter-clear:hover,
      .filter-clear:focus-visible {
        opacity: 1;
        background: var(
          --vscode-toolbar-hoverBackground,
          var(--vscode-list-hoverBackground)
        );
        outline: none;
      }
      .filter-clear:disabled {
        opacity: 0;
        pointer-events: none;
      }
      .tree-scroll {
        flex: 1;
        overflow: auto;
        padding: 0px 8px;
        color: var(--vscode-foreground);
      }
      .tree-node {
        color: inherit;
      }
      details.tree-node {
        margin: 0;
      }
      details.tree-node > summary {
        list-style: none;
      }
      details.tree-node > summary::-webkit-details-marker {
        display: none;
      }
      .tree-node-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 8px;
        padding-left: calc(10.5px + var(--tree-depth, 0px)*1.75);
        margin: 0;
        border-radius: 4px;
        cursor: pointer;
        position: relative;
        min-height: 24px;
        color: inherit;
      }
      .tree-node-row.is-root::before {
        display: none;
      }
      .tree-node-row::before {
        content: "";
        position: absolute;
        left: calc(24px + var(--tree-depth, 0px));
        top: 0px;
        bottom: 0px;
        width: 1px;
        background: var(--vscode-tree-indentGuidesStroke, transparent);
        opacity: 0;
        transition: opacity 120ms ease;
      }
      .tree-scroll:hover .tree-node-row::before {
        opacity: 0.35;
      }
      .tree-node-row:focus-visible {
        outline: 1px solid var(--vscode-focusBorder);
        outline-offset: -1px;
      }
      .tree-node-row:hover {
        background: var(--vscode-list-hoverBackground);
      }
      /* details[open] > summary.tree-node-row {
        background: var(--vscode-list-inactiveSelectionBackground, transparent);
      } */
      .tree-node-twistie {
        width: 12px;
        height: 12px;
        margin-right: 0px;
        position: relative;
        flex: 0 0 12px;
      }
      .tree-node-twistie::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        border-style: solid;
        border-width: 4px 0 4px 6px;
        border-color: transparent transparent transparent
          var(--vscode-icon-foreground);
        transform-origin: center;
        transition: transform 120ms ease;
      }
      details[open] > summary .tree-node-twistie::after {
        transform: rotate(90deg);
      }
      .tree-node-twistie.is-leaf::after {
        border-width: 0;
      }
      .tree-node-icon {
        width: 16px;
        height: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        opacity: 0.85;
      }
      .tree-node-icon.codicon,
      .tree-node-action-icon.codicon,
      .context-menu-icon.codicon {
        font-size: 14px;
        line-height: 1;
      }
      .tree-node-icon.is-empty {
        opacity: 0.2;
      }
      .tree-node-label {
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tree-node-description {
        color: var(--vscode-descriptionForeground);
        font-size: 0.9em;
        margin-left: 4px;
      }
      .tree-node-actions {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-left: auto;
      }
      .tree-node-action {
        border: 1px solid transparent;
        background: transparent;
        color: var(--vscode-icon-foreground);
        padding: 2px 4px;
        border-radius: 3px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 20px;
        min-height: 20px;
      }
      .tree-node-action:hover {
        background: var(
          --vscode-toolbar-hoverBackground,
          var(--vscode-list-hoverBackground)
        );
        border-color: var(--vscode-toolbar-hoverOutline);
      }
      .tree-node-action:focus-visible {
        outline: 1px solid var(--vscode-focusBorder);
        outline-offset: 1px;
      }
      .tree-node-action-icon {
        font-size: 12px;
        line-height: 1;
      }
      .tree-node-children {
        margin: 0;
        padding: 0;
      }
      .empty-message {
        padding: 4px 16px;
        color: var(--vscode-descriptionForeground);
      }
      .context-menu {
        position: fixed;
        min-width: 180px;
        background: var(
          --vscode-menu-background,
          var(--vscode-editorWidget-background)
        );
        color: var(--vscode-menu-foreground, inherit);
        border: 1px solid var(--vscode-menu-border, var(--vscode-widget-border));
        border-radius: 4px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
        padding: 4px 0;
        z-index: 1000;
      }
      .context-menu-item {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        background: transparent;
        border: 0;
        padding: 4px 12px;
        font: inherit;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }
      .context-menu-item:hover,
      .context-menu-item:focus-visible {
        background: var(
          --vscode-menu-selectionBackground,
          var(--vscode-list-hoverBackground)
        );
        color: var(--vscode-menu-selectionForeground, inherit);
        outline: none;
      }
      .context-menu-icon {
        width: 16px;
        text-align: center;
        font-size: 12px;
        opacity: 0.8;
      }
      .context-menu-label {
        flex: 1;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="view-root">
      <div class="input-box">
        <div class="filter-wrapper">
          <input
            id="filter"
            class="filter-input"
            type="text"
            placeholder="Filter runs..."
          />
          <button
            id="filter-clear"
            class="filter-clear"
            type="button"
            aria-label="Clear filter"
          >
            <span class="codicon codicon-close"></span>
          </button>
        </div>
      </div>
      <div
        id="tree"
        class="tree-scroll"
        role="tree"
        aria-label="Remote Cloud Pipeline runs"
      ></div>
    </div>
    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
  </body>
</html>
